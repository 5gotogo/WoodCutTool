<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-labelledby="title desc"><title id="title">Illustrative cabinet filler survey</title><desc id="desc">A 55 millimeter blank along a cabinet datum. Five measured gaps are 42, 45, 49, 46 and 43 millimeters at heights 0, 200, 400, 600 and 800 millimeters. The wall line between stations is illustrative only. The two axes use different scales.</desc><rect width="900" height="680" rx="20" fill="#f6f3eb"/><g font-family="system-ui,sans-serif" fill="#233e36"><text x="45" y="49" font-size="28" font-weight="700">A filler follows the wall, not the average gap</text><text x="45" y="82" font-size="18">Illustrative face-plane survey · axes use different scales</text><rect x="110" y="125" width="275" height="440.00000000000006" fill="#e7d8b9"/><polygon points="110,125 320,125 335,235 355,345 340,455 325,565 110,565" fill="#c9a574"/><polyline points="320,125 335,235 355,345 340,455 325,565" fill="none" stroke="#b64f32" stroke-width="4"/><line x1="110" y1="115" x2="110" y2="575" stroke="#233e36" stroke-width="4"/><line x1="385" y1="115" x2="385" y2="575" stroke="#766d5c" stroke-width="2" stroke-dasharray="6 5"/><circle cx="320" cy="125" r="5" fill="#b64f32"/><text x="334" y="131" font-size="18">0 mm: 42 mm gap</text><circle cx="335" cy="235" r="5" fill="#b64f32"/><text x="349" y="241" font-size="18">200 mm: 45 mm gap</text><circle cx="355" cy="345" r="5" fill="#b64f32"/><text x="369" y="351" font-size="18">400 mm: 49 mm gap</text><circle cx="340" cy="455" r="5" fill="#b64f32"/><text x="354" y="461" font-size="18">600 mm: 46 mm gap</text><circle cx="325" cy="565" r="5" fill="#b64f32"/><text x="339" y="571" font-size="18">800 mm: 43 mm gap</text><text x="45" y="610" font-size="19">Cabinet datum x = 0 · blank outer edge x = 55 mm</text><text x="45" y="646" font-size="18">Points are survey checks; transfer and verify the complete wall profile on site.</text></g></svg>
