<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drill Bit Finder — Pilot Hole Size Calculator</title>
  <meta name="description" content="Find a nearest fractional drill bit for pilot holes or clearance holes from screw diameter and material type.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://woodcuttool.com/drill-bit-finder/">
  <link rel="icon" href="/favicon.ico?v=rounded-mask-20260619" sizes="any">
  <style>.mega-menu{display:none}</style>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-site-header></div>
  <main id="main">
    <section class="section"><p class="breadcrumb"><a href="/">Home</a> / <a href="/tools/">Tools</a> / Drill Bit Finder</p><p class="eyebrow">Pilot hole helper</p><h1>Drill Bit Finder</h1><p class="lead">Match a screw diameter to a nearby fractional drill bit for pilot holes or clearance holes.</p></section>
    <section class="section tool-layout">
      <div class="tool-panel"><form id="drill-bit-form">
        <fieldset><legend>Hole setup</legend><div class="input-grid two">
          <label>Screw diameter (in) <input name="screwDiameter" type="number" min="0.01" step="0.001" value="0.164"></label>
          <label>Material / hole type <select name="material"><option value="softwood">Softwood pilot</option><option value="hardwood">Hardwood pilot</option><option value="clearance">Clearance hole</option></select></label>
        </div></fieldset>
        <button class="button" type="submit">Find drill bit</button>
      </form></div>
      <aside class="result-panel" id="drill-bit-result" aria-live="polite"><h2>Drill bit result</h2><p class="placeholder">Run the finder to see nearest bit, decimal size, metric size, and target hole.</p></aside>
    </section>
  </main>
  <div data-site-footer></div>
