<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="jl-svg-title-dowel jl-svg-desc-dowel"><title id="jl-svg-title-dowel">Dowel row — dimension reference</title><desc id="jl-svg-desc-dowel">Schematic, not to scale. All labeled lengths are millimeters. Center pitch: 80 mm; Outer skin at tip: 4 mm; Pair end reserve: 2 mm</desc><rect width="720" height="350" rx="12" fill="#f2eee3"/><g font-family="Arial,sans-serif" font-size="14" fill="#254b42"><rect x="65" y="80" width="520" height="66" fill="#c8b28e"/><circle cx="117" cy="113" r="6" fill="#235b50"/><circle cx="255.66666666666666" cy="113" r="6" fill="#235b50"/><circle cx="394.3333333333333" cy="113" r="6" fill="#235b50"/><circle cx="533" cy="113" r="6" fill="#235b50"/><text x="600" y="118">A</text><rect x="65" y="185" width="520" height="66" fill="#c8d9ce"/><circle cx="117" cy="218" r="6" fill="#235b50"/><circle cx="255.66666666666666" cy="218" r="6" fill="#235b50"/><circle cx="394.3333333333333" cy="218" r="6" fill="#235b50"/><circle cx="533" cy="218" r="6" fill="#235b50"/><text x="600" y="223">B</text><text x="65" y="60">Corresponding marked end → centers 30 … 270 mm</text><text x="65" y="290">Row from marked side 30 mm · 4 holes per face</text><text x="65" y="336" font-size="11">SCHEMATIC · NOT TO SCALE · ALL LENGTHS mm · PROVE ON A TEST PAIR</text></g></svg>
