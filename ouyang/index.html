<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff8fbd">
  <meta name="robots" content="noindex, nofollow">
  <title>欧阳仙女，要天天开心呀</title>
  <meta name="description" content="送给欧阳仙女的一份粉色小祝福：希望你天天开心。来自大宝和希皓。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://woodcuttool.com/ouyang/">
  <meta property="og:title" content="欧阳仙女，要天天开心呀">
  <meta property="og:description" content="一份来自大宝和希皓的粉色小祝福 💕">
  <meta property="og:image" content="https://woodcuttool.com/ouyang/ouyang-fairy-day.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      color-scheme: light;
      --berry: #d94d86;
      --pink: #ff8fbd;
      --pink-deep: #f36ca7;
      --cream: #fff9f5;
      --ink: #713451;
      --muted: #9c6680;
      --card: rgba(255,255,255,.78);
      --line: rgba(217,77,134,.17);
      --shadow: 0 24px 70px rgba(188,77,126,.2);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 12%, rgba(255,255,255,.96) 0 4%, transparent 18%),
        radial-gradient(circle at 92% 20%, rgba(255,223,237,.92) 0 8%, transparent 23%),
        linear-gradient(155deg, #fff9fb 0%, #ffe8f1 45%, #ffd5e7 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      content: "";
      filter: blur(4px);
      opacity: .55;
    }

    body::before {
      top: -130px;
      left: -90px;
      background: linear-gradient(145deg, #ffb8d5, #fff4d2);
    }

    body::after {
      right: -120px;
      bottom: -120px;
      background: linear-gradient(145deg, #e8d3ff, #ffb2d2);
    }

    button { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 50px;
    }

    .tiny-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--berry);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .tiny-note::before,
    .tiny-note::after {
      width: 28px;
      height: 1px;
      background: currentColor;
      content: "";
      opacity: .45;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, .86fr) minmax(340px, 1.14fr);
      align-items: center;
      gap: clamp(24px, 5vw, 64px);
      padding: clamp(22px, 4vw, 46px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 38px;
      background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,244,249,.72));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .copy { position: relative; z-index: 2; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--berry);
      background: rgba(255,255,255,.7);
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin: 18px 0 0;
      font-size: clamp(2.55rem, 7vw, 5.25rem);
      line-height: .98;
      letter-spacing: -.07em;
    }

    h1 span {
      display: block;
      margin-top: 13px;
      color: transparent;
      background: linear-gradient(100deg, var(--berry), #ff70a7 55%, #ef88d8);
      background-clip: text;
      -webkit-background-clip: text;
      font-size: .63em;
      letter-spacing: -.05em;
    }

    .lead {
      max-width: 520px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.16rem);
      font-weight: 650;
      line-height: 1.9;
    }

    .wish-button {
      position: relative;
      min-height: 52px;
      margin-top: 26px;
      padding: 13px 22px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(105deg, var(--berry), var(--pink-deep));
      box-shadow: 0 14px 30px rgba(217,77,134,.28);
      cursor: pointer;
      font-weight: 900;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .wish-button:hover { transform: translateY(-2px) scale(1.015); box-shadow: 0 18px 36px rgba(217,77,134,.34); }
    .wish-button:active { transform: scale(.98); }
    .wish-button:focus-visible { outline: 4px solid rgba(217,77,134,.24); outline-offset: 4px; }

    .art-wrap {
      position: relative;
      min-width: 0;
      padding: 8px;
      transform: rotate(1.5deg);
    }

    .art-wrap::before {
      position: absolute;
      inset: -10px 7% 7% -8%;
      z-index: -1;
      border-radius: 50%;
      background: rgba(255,165,201,.25);
      content: "";
      filter: blur(20px);
    }

    .hero-art {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border: 8px solid rgba(255,255,255,.78);
      border-radius: 31px;
      box-shadow: 0 20px 52px rgba(170,71,113,.25);
    }

    .sticker {
      position: absolute;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 2px solid #fff;
      border-radius: 20px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 13px 30px rgba(151,66,105,.18);
      font-size: 28px;
      animation: bob 3.3s ease-in-out infinite;
    }

    .sticker.one { top: -4px; right: -5px; transform: rotate(10deg); }
    .sticker.two { left: -12px; bottom: 22px; animation-delay: -1.4s; transform: rotate(-8deg); }

    .wishes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 18px;
    }

    .wish-card {
      min-height: 176px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 27px;
      background: var(--card);
      box-shadow: 0 16px 38px rgba(188,77,126,.1);
      backdrop-filter: blur(14px);
    }

    .wish-card .emoji { display: block; margin-bottom: 15px; font-size: 32px; }
    .wish-card strong { display: block; font-size: 1.05rem; }
    .wish-card p { margin: 9px 0 0; color: var(--muted); line-height: 1.7; }

    .signature {
      margin-top: 18px;
      padding: 28px 18px;
      border: 1px dashed rgba(217,77,134,.25);
      border-radius: 26px;
      text-align: center;
      background: rgba(255,255,255,.52);
    }

    .signature p { margin: 0; color: var(--muted); font-size: 14px; }
    .signature strong { display: block; margin-top: 7px; color: var(--berry); font-size: clamp(1.3rem, 4vw, 1.75rem); }

    .floating-heart {
      position: fixed;
      z-index: 10;
      left: var(--x);
      bottom: -40px;
      pointer-events: none;
      animation: fly var(--duration) ease-in forwards;
      filter: drop-shadow(0 5px 6px rgba(202,68,123,.18));
    }

    .sparkle {
      position: absolute;
      z-index: 1;
      color: #ff88b9;
      pointer-events: none;
      animation: twinkle 2.4s ease-in-out infinite;
    }

    .sparkle.s1 { top: 7%; left: 48%; font-size: 24px; }
    .sparkle.s2 { right: 2%; bottom: 8%; font-size: 18px; animation-delay: -.8s; }
    .sparkle.s3 { left: 3%; bottom: 12%; font-size: 20px; animation-delay: -1.4s; }

    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
    @keyframes twinkle { 0%, 100% { opacity: .25; scale: .8; } 50% { opacity: 1; scale: 1.15; } }
    @keyframes fly {
      0% { translate: 0 0; rotate: 0deg; opacity: 0; scale: .65; }
      12% { opacity: 1; }
      100% { translate: var(--drift) -115vh; rotate: 25deg; opacity: 0; scale: 1.2; }
    }

    @media (max-width: 760px) {
      .page { padding-top: 22px; }
      .hero { grid-template-columns: 1fr; padding: 22px; border-radius: 28px; }
      .copy { text-align: center; }
      .lead { margin-inline: auto; }
      .art-wrap { order: -1; }
      .hero-art { border-width: 5px; border-radius: 24px; }
      .wishes { grid-template-columns: 1fr; }
      .wish-card { min-height: 0; }
      .sparkle.s1 { left: 7%; top: 42%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="tiny-note">一份只属于你的粉色小心意</div>

    <section class="hero" aria-labelledby="page-title">
      <span class="sparkle s1" aria-hidden="true">✦</span>
      <span class="sparkle s2" aria-hidden="true">✦</span>
      <span class="sparkle s3" aria-hidden="true">✦</span>

      <div class="copy">
        <div class="badge">🌸 今日份可爱祝福已送达</div>
        <h1 id="page-title">欧阳仙女<span>希望你天天开心呀</span></h1>
        <p class="lead" id="daily-wish">愿你的每一天，都有花、有糖、有好心情。愿所有的小幸运，都在认真地奔向你。</p>
        <button class="wish-button" id="wish-button" type="button">💗 收下今日份开心</button>
      </div>

      <div class="art-wrap">
        <img class="hero-art" src="/ouyang/ouyang-fairy-day.jpg" alt="粉色云朵花园里，兔兔和小熊陪伴着开心的小仙女" width="1400" height="788">
        <span class="sticker one" aria-hidden="true">🌷</span>
        <span class="sticker two" aria-hidden="true">🍓</span>
      </div>
    </section>

    <section class="wishes" aria-label="送给欧阳仙女的三个小愿望">
      <article class="wish-card">
        <span class="emoji" aria-hidden="true">🐰</span>
        <strong>每天都有好心情</strong>
        <p>烦恼轻轻飞走，嘴角一直向上，醒来就能遇见值得开心的小事。</p>
      </article>
      <article class="wish-card">
        <span class="emoji" aria-hidden="true">🍓</span>
        <strong>生活甜甜的</strong>
        <p>喜欢的人和事都在身边，每一份期待，都能得到温柔的回应。</p>
      </article>
      <article class="wish-card">
        <span class="emoji" aria-hidden="true">✨</span>
        <strong>好运一直偏爱你</strong>
        <p>做自由快乐的小仙女，闪闪发光，也永远被这个世界温柔对待。</p>
      </article>
    </section>

    <footer class="signature">
      <p>这份小小的祝福，备注是</p>
      <strong>大宝和希皓 💕</strong>
    </footer>
  </main>

  <script>
    const wishes = [
      "愿你今天比昨天更开心一点，明天又比今天更幸运一点。",
      "愿你永远有发现小美好的眼睛，也有被好好爱着的底气。",
      "愿所有温柔都与你不期而遇，所有快乐都准时来找你。",
      "愿欧阳仙女无忧无虑，可可爱爱，天天都有好心情。"
    ];

    const button = document.querySelector("#wish-button");
    const dailyWish = document.querySelector("#daily-wish");
    let wishIndex = 0;

    function releaseHearts() {
      const symbols = ["💗", "💕", "🌸", "✨", "💖", "🎀"];
      for (let index = 0; index < 24; index += 1) {
        const heart = document.createElement("span");
        heart.className = "floating-heart";
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.setProperty("--x", `${Math.random() * 100}vw`);
        heart.style.setProperty("--drift", `${Math.random() * 140 - 70}px`);
        heart.style.setProperty("--duration", `${2.8 + Math.random() * 2.4}s`);
        heart.style.fontSize = `${18 + Math.random() * 20}px`;
        heart.style.animationDelay = `${Math.random() * .7}s`;
        document.body.appendChild(heart);
        window.setTimeout(() => heart.remove(), 6200);
      }
    }

    button.addEventListener("click", () => {
      dailyWish.textContent = wishes[wishIndex % wishes.length];
      wishIndex += 1;
      button.textContent = "💞 开心已成功签收";
      releaseHearts();
      window.setTimeout(() => { button.textContent = "💗 再收下一份开心"; }, 1600);
    });
  </script>
</body>
</html>
